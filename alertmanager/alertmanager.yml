global:
  resolve_timeout: 5m

route:
  group_by: [service, team]
  group_wait: 20s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'ai-remediation'
  routes:
    - match:
        severity: critical
      repeat_interval: 15m
      receiver: 'ai-remediation'

receivers:
  - name: 'ai-remediation'
    webhook_configs:
      - url: 'http://ai-remediation-agent:3003/alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [team]

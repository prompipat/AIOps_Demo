global:
  resolve_timeout: 5m
  slack_api_url: ${SLACK_WEBHOOK_URL}

route:
  group_by: [alertname, team]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: slack-default

  routes:
    - match:
        severity: critical
      receiver: slack-critical
    - match:
        severity: warning
      receiver: slack-warning

receivers:
  - name: slack-default
    slack_configs:
      - channel: '#alerts'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  - name: slack-critical
    slack_configs:
      - channel: '#alerts'
        color: '{{ if eq .Status "resolved" }}#36a64f{{ else }}#FF0000{{ end }}'
        title: '{{ if eq .Status "resolved" }}✅ RESOLVED{{ else }}🔴 CRITICAL{{ end }}: {{ .GroupLabels.alertname }}'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Detail:* {{ .CommonAnnotations.description }}
          *Team:* {{ .CommonLabels.team }}
          *Status:* {{ .Status | toUpper }}
        send_resolved: true
    webhook_configs:
      - url: http://webhook-logger:5001/critical
        send_resolved: true

  - name: slack-warning
    slack_configs:
      - channel: '#alerts'
        color: '{{ if eq .Status "resolved" }}#36a64f{{ else }}#FFA500{{ end }}'
        title: '{{ if eq .Status "resolved" }}✅ RESOLVED{{ else }}🟡 WARNING{{ end }}: {{ .GroupLabels.alertname }}'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Detail:* {{ .CommonAnnotations.description }}
          *Status:* {{ .Status | toUpper }}
        send_resolved: true
    webhook_configs:
      - url: http://webhook-logger:5001/warning
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [team]
global:
  resolve_timeout: 5m

route:
  group_by: [alertname, team]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m
  receiver: default

  routes:
    - match:
        severity: critical
      receiver: critical-receiver
      continue: true
    - match:
        team: payments
      receiver: payments-receiver

receivers:
  - name: default
    webhook_configs:
      - url: http://webhook-logger:5001/alert
        send_resolved: true

  - name: critical-receiver
    webhook_configs:
      - url: http://webhook-logger:5001/critical
        send_resolved: true
  
  - name: payments-receiver
    webhook_configs:
      - url: http://webhook-logger:5001/payments
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [team]
global:
  resolve_timeout: 5m
  slack_api_url: ${SLACK_WEBHOOK_URL}

route:
  group_by: [alertname, team]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 10m
  receiver: slack-default

  routes:
    - match:
        severity: critical
      receiver: slack-critical
    - match:
        severity: warning
      receiver: slack-warning

receivers:
  - name: slack-default
    slack_configs:
      - channel: '#alerts'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alert }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  - name: slack-critical
    slack_configs:
      - channel: '#alerts'
        color: '#FF0000'
        title: '🔴 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Detail:* {{ .CommonAnnotations.description }}
          *Team:* {{ .CommonLabels.team }}
        send_resolved: true
    webhook_configs:
      - url: http://webhook-logger:5001/critical
        send_resolved: true

  - name: slack-warning
    slack_configs:
      - channel: '#alerts'
        color: '#FFA500'
        title: '🟡 WARNING: {{ .GroupLabels.alertname }}'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Detail:* {{ .CommonAnnotations.description }}
        send_resolved: true
    webhook_configs:
      - url: http://webhook-logger:5001/warning
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [team]
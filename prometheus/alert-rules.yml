groups:
  - name: aiops-lab-alerts
    interval: 15s
    rules:

      - alert: HighPaymentErrorRate
        expr: |
          (
            sum(rate(aiops_lab_charges_total{status="failed"}[2m]))
            /
            sum(rate(aiops_lab_charges_total[2m]))
          ) * 100 > 25
        for: 1m
        labels:
          severity: critical
          team: payments
          service: payment-service
        annotations:
          summary: "Payment error rate สูงผิดปกติ"
          description: "Error rate อยู่ที่ {{ printf \"%.1f\" $value }}% (threshold 25%)"

      - alert: HighAPILatency
        expr: |
          histogram_quantile(0.99,
            rate(aiops_lab_api_request_duration_milliseconds_bucket[2m])
          ) > 800
        for: 2m
        labels:
          severity: warning
          team: platform
          service: api-gateway
        annotations:
          summary: "API latency p99 สูงเกิน 800ms"
          description: "p99 latency อยู่ที่ {{ printf \"%.0f\" $value }}ms"

      - alert: ApiGatewayTargetDown
        expr: |
          up{job="api-gateway"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
          service: api-gateway
        annotations:
          summary: "API gateway target is down"
          description: "Prometheus cannot scrape api-gateway for more than 1 minute."

      - alert: OrderServiceTargetDown
        expr: |
          up{job="order-service"} == 0
        for: 1m
        labels:
          severity: critical
          team: orders
          service: order-service
        annotations:
          summary: "Order service target is down"
          description: "Prometheus cannot scrape order-service for more than 1 minute."

      - alert: PaymentServiceDown
        expr: |
          sum(rate(aiops_lab_charges_total[1m])) == 0
        for: 1m
        labels:
          severity: critical
          team: payments
          service: payment-service
        annotations:
          summary: "Payment service ไม่มี traffic"
          description: "ไม่มี charge request เข้ามานานกว่า 1 นาที"

      - alert: PaymentServiceTargetDown
        expr: |
          up{job="payment-service"} == 0
        for: 1m
        labels:
          severity: critical
          team: payments
          service: payment-service
        annotations:
          summary: "Payment service target is down"
          description: "Prometheus cannot scrape payment-service for more than 1 minute."

      - alert: LowOrderSuccessRate
        expr: |
          (
            sum(rate(aiops_lab_orders_created_total{status="success"}[2m]))
            /
            sum(rate(aiops_lab_orders_created_total[2m]))
          ) * 100 < 70
        for: 2m
        labels:
          severity: warning
          team: orders
          service: order-service
        annotations:
          summary: "Order success rate ต่ำกว่า 70%"
          description: "Success rate อยู่ที่ {{ printf \"%.1f\" $value }}%"
